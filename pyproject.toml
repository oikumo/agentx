[project]
name = "agentx"
version = "0.2.0"
readme = "README.md"
description = "Educational LLM agent framework with a console REPL — chat, RAG, function calling, and graph-based reasoning workflows."
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "chromadb==1.5.9",
    "langchain==1.3.14",
    "langchain-community==0.4.2",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.4.2",
    "langchain-pinecone==0.2.13",
    "langchain-tavily==0.2.18",
    "pypdf==6.15.0",
    "python-dotenv==1.2.2",
    "langchain-experimental==0.4.2",
    "llama-cpp-python==0.3.34",
    "faiss-cpu==1.15.0",
    "langchain-chroma==1.1.0",
    "langgraph==1.2.10",
    "grandalf==0.8",
    "langchain-google-genai==4.3.2",
    "langchain-core==1.5.3",
    "langchain-openrouter==0.2.7",
    "langchain-nvidia-ai-endpoints==1.4.3",
    "openai==2.53.0",
    "aiohttp==3.14.3",
    "numpy>=2.5.1",
    "uuid64>=0.2.0",
    "httptools==0.8.0",
    "watchfiles==1.2.0",
    "deepagents==0.7.5",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-xdist>=3.8.0",
]

[project.scripts]
agentx = "agentx.main:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Fast local default: deselect the 2 live opencode LLM smoke tests (~400s of the
# ~494s suite — they drive the REAL binary + real LLM round-trips and hang on
# the 240s timeout when the runtime is slow). Opt back in explicitly with
# `-m opencode_live` (CI / scheduled full-suite runs).
# Parallel by default (Tier-2 suite-speed: pytest-xdist, 72s -> ~41s for the
# full 2103-test set, same coverage). `--dist loadfile` keeps each test FILE
# on one worker (module-scoped shared fixtures stay safe); toolbox tests run
# on private per-module TOOLBOX_ROOTs (hermetic, zero repo writes). TDD inner
# loop escape hatch for single files: `uv run pytest <path> -n0` (serial,
# avoids ~2s worker spawn on sub-second files).
addopts = "-m 'not opencode_live' -n auto --dist loadfile"
markers = [
    "opencode_live: slow tests that drive the REAL opencode binary (skipped when binary absent)",
]
filterwarnings = [
    # Upstream: langchain_core imports pydantic.v1 on Python 3.14+.
    # Outside our control — suppress the noise.
    "ignore:Core Pydantic V1 functionality isn't compatible with Python 3.14:UserWarning",
]
